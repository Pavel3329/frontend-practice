<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <main class="orderApp">
      <form class="orderForm">
        <h2>Create order</h2>
        <input type="text" name="address" placeholder="Address" required />
        <input
          type="number"
          name="price"
          placeholder="Price"
          min="0"
          step="0.01"
          required
        />
        <input type="text" name="receiver" placeholder="Receiver" required />
        <button type="submit">Create</button>
      </form>
      <div class="orderButtons hidden">
        <button class="paidBtn" type="button">Order paid</button>
        <button class="sentBtn" type="button">Order sent</button>
        <button class="receivedBtn" type="button">Order received</button>
      </div>
    </main>
    <div class="notificationContainer"></div>
  </body>

  <script src="scripts/script.js"></script>
</html>
